###############################
# OpenTelemetry Logging Configuration for Apache Airflow
###############################
# Add these configurations to your airflow.cfg file to enable OpenTelemetry logging
# This configuration works alongside the existing OTEL provider for traces and metrics

[logging]
# Enable OpenTelemetry task handler for task logs
# This handler will emit task logs to your OTEL collector while maintaining file-based logging
remote_logging = False
logging_config_class = airflow_provider_opentelemetry.log_handlers.otel_logging_config.OTEL_LOGGING_CONFIG

# Base log folder (standard Airflow configuration)
base_log_folder = ${AIRFLOW_HOME}/logs

# Task log reader (standard Airflow configuration)
task_log_reader = task

# Log formatter (standard Airflow configuration)
log_format = [%%(asctime)s] {%%(filename)s:%%(lineno)d} %%(levelname)s - %%(message)s
simple_log_format = %%(asctime)s %%(levelname)s - %%(message)s

###############################
# OpenTelemetry Endpoint Configuration
###############################
# These configurations are used when Airflow's native OTEL traces are NOT enabled
# If you have already configured [traces] section for native Airflow OTEL support,
# the logging provider will automatically use those settings.

# Option 1: Using Airflow's native OTEL traces configuration (Airflow 2.10+)
# If you have this section configured, the logging provider will use these settings
[traces]
otel_on = True
otel_host = localhost
otel_port = 4318
otel_ssl_active = False
otel_service = Airflow

# Option 2: Using environment variables (alternative to connection-based config)
# Set these environment variables if not using the [traces] section above:
# export OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
# export OTEL_SERVICE_NAME=Airflow
# export OTEL_EXPORTER_OTLP_HEADERS_API_KEY_NAME=x-api-key  # Optional
# export OTEL_EXPORTER_OTLP_HEADERS_API_KEY=your-api-key    # Optional

# Option 3: Using Airflow Connection (via OtelHook)
# Create an Airflow connection of type 'otel' with connection ID 'otel_default'
# The logging provider will fallback to this if neither Option 1 nor Option 2 is configured

###############################
# Additional Logging Configuration
###############################

# Control log level for different components
[logging]
# Airflow core log level
logging_level = INFO

# Task log level (applies to task execution logs)
fab_logging_level = WARN

# DAG processor log level
dag_processor_manager_log_level = INFO

